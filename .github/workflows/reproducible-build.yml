# AEGIS relay (backend) — проверка ВОСПРОИЗВОДИМОСТИ на CI (P9, §9/§12.2).
#
# Запускает scripts/verify-reproducible-build.sh (двойная сборка бинаря
# aegis-relay + сравнение SHA-256) на независимом раннере. Опционально сверяет
# бинарь из Docker-образа (rust:1.97.0-bookworm). См. docs/reproducible-builds.md.
name: reproducible-build

on:
  workflow_dispatch:
    inputs:
      docker:
        description: "Также собрать и сверить бинарь из Docker (1/0)"
        default: "0"
        required: false
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  relay-repro:
    name: aegis-relay double-build (SHA-256 match)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: ${{ github.event.inputs.docker == '1' }}
        uses: docker/setup-buildx-action@v3

      - name: Show pinned toolchain
        run: rustc --version

      - name: Verify reproducible build (aegis-relay)
        env:
          AEGIS_VERIFY_DOCKER: ${{ github.event.inputs.docker || '0' }}
        run: bash scripts/verify-reproducible-build.sh
