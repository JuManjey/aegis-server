# AEGIS coturn — TCP-TURN за Onion Service v3 (§7.5 / §10.10 / §12.2).
#
# Роль: ретранслировать медиапоток звонка, когда прямого пути между абонентами
# нет. Это происходит ГОРАЗДО чаще, чем кажется: мобильный оператор с CGNAT,
# активный VPN, изоляция клиентов на точке доступа — в любом из этих случаев
# host-кандидаты обеих сторон друг для друга недостижимы. RTP работает по UDP, а
# Tor несёт только TCP, поэтому обе стороны подключаются к этому coturn ЧЕРЕЗ Tor
# (transport=tcp) и релеят друг другу медиа через свои аллокации на одном сервере.
#
# ZERO-TRUST (§10.9): медиа остаётся сквозным (DTLS-SRTP) — coturn ретранслирует
# ТОЛЬКО шифртекст. Оба пира приходят из Tor (реальный IP скрыт), поэтому coturn
# не видит ни личности, ни IP, ни содержимого. `static-auth-secret` передаётся
# ОТДЕЛЬНО (флагом из .env), в этот файл его НЕ кладём (в репозиторий не коммитим).
#
# Наружу (на хост/интернет) порт НЕ публикуется — единственная точка входа — второй
# onion-адрес tor-контейнера (HiddenServicePort 3478 → aegis-coturn:3478).
#
# Клирнет-профиль (docker-compose.clearnet.yml, клиенты в режиме «Tor ВЫКЛ»)
# монтирует вместо этого файла turnserver.clearnet.conf: тот же адрес
# ретрансляции и та же политика пиров, плюс TURNS 5349 и выключенный журнал.

# Слушаем 3478 и по TCP (через onion — TURN), и по UDP (STUN Binding).
#
# UDP-порт наружу НЕ публикуется этим файлом: публикация — осознанное решение
# администратора через `docker-compose.stun.yml`. Пока он не подключён, единственная
# точка входа остаётся onion, как и было.
#
# Почему STUN работает при белом списке пиров ниже: правила `allowed-peer-ip` /
# `denied-peer-ip` управляют РЕТРАНСЛЯЦИЕЙ (кому разрешено пересылать медиа), а
# STUN Binding ничего не ретранслирует — он одним пакетом отвечает клиенту, каким
# его адрес виден снаружи. Поэтому прямые звонки и закрытый ретранслятор
# сосуществуют без противоречия.
#
# `secure-stun` НЕ включаем сознательно: WebRTC отправляет Binding без
# аутентификации, и требование креды сломало бы обнаружение адреса. Ответ Binding
# не раскрывает ничего, кроме адреса самого спрашивающего.
listening-port=3478
listening-ip=0.0.0.0

# --- Адрес ретрансляции ------------------------------------------------------
#
# `external-ip` здесь НЕ ЗАДАЁТСЯ СОЗНАТЕЛЬНО, и это важно понимать, потому что
# «забыли external-ip» — самая частая догадка при разборе TURN.
#
# В обычном (публичном) развёртывании coturn обязан объявлять в XOR-RELAYED-ADDRESS
# свой ПУБЛИЧНЫЙ адрес: собеседник приходит из интернета и должен попасть на него
# напрямую. У нас развёртывание принципиально другое: coturn доступен ТОЛЬКО через
# onion, и оба абонента всегда подключены к ОДНОМУ И ТОМУ ЖЕ экземпляру. Их
# relay-кандидаты — это два порта одного и того же контейнера, и трафик между
# аллокациями не покидает compose-сеть.
#
# Если подставить сюда публичный IP, пакеты между аллокациями пойдут наружу и
# обратно (hairpin NAT), что на большинстве хостингов просто не работает.
# Поэтому: адрес ретрансляции = адрес контейнера в compose-сети. Он закреплён
# статически в docker-compose.yml (ipv4_address), чтобы не менялся между
# `docker compose down/up` и совпадал с allowed-peer-ip ниже.
relay-ip=172.28.7.10

# Диапазон портов ретрансляции. Задан явно, чтобы поведение было предсказуемым;
# наружу эти порты не публикуются (весь трафик приходит из compose-сети).
#
# Размер согласован с total-quota ниже: на аллокацию нужен как минимум один порт,
# поэтому диапазон обязан быть ЗАМЕТНО шире квоты — иначе при наплыве звонков
# coturn начнёт отказывать в аллокациях по исчерпанию портов, а в логе это
# выглядит как загадочный «error 508» без связи с квотами.
min-port=49152
max-port=51152

# Аутентификация по общему секрету (TURN REST API, draft-uberti-behave-turn-rest).
# Клиент получает эфемерные креды у релея (GET /v1/turn); сам секрет знают только
# релей и coturn. Сам секрет задаётся флагом `--static-auth-secret` из .env.
use-auth-secret
realm=aegis

# Только TCP (Tor не несёт UDP/DTLS). TLS не нужен — шифрование даёт Tor.
no-tls
no-dtls

# Минимизация поверхности и метаданных.
no-cli
no-multicast-peers
no-software-attribute
stale-nonce=600
# FINGERPRINT в ответах STUN: дешёвая защита от путаницы TURN-трафика с чужими
# протоколами на том же порту.
fingerprint
# Выключаем расширения RFC 5780 (обнаружение типа NAT). Нам они не нужны —
# клиенты не «прощупывают» NAT через этот сервер, — а отвечая на такие запросы,
# сервер работает усилителем и даёт лишний материал для профилирования.
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# --- КОМУ РАЗРЕШЕНО РЕТРАНСЛИРОВАТЬ ------------------------------------------
#
# ЭТО ГЛАВНАЯ НАСТРОЙКА БЕЗОПАСНОСТИ ФАЙЛА.
#
# Ранее здесь стояло `allowed-peer-ip=0.0.0.0-255.255.255.255`, то есть открытый
# ретранслятор: любой, кто добыл эфемерные креды (а их выдаёт GET /v1/turn всем,
# кто знает onion-адрес релея), мог гонять произвольный UDP-трафик с вашего VPS на
# ЛЮБОЙ адрес в интернете. Это готовый инструмент для сканирования, отражённых
# атак и обхода блокировок от имени вашего сервера — с вашей ответственностью.
#
# Легитимный сценарий ровно один: аллокация одного абонента отправляет в
# аллокацию другого на ЭТОМ ЖЕ сервере. Значит, единственный допустимый адрес
# пира — адрес самого coturn в compose-сети. Всё остальное запрещаем.
#
# Порядок правил работает так (документация coturn): «если адрес попал и в
# allowed, и в denied, он считается РАЗРЕШЁННЫМ». Поэтому запрет всего диапазона
# плюс точечное разрешение — это ровно белый список, а не противоречие.
denied-peer-ip=0.0.0.0-255.255.255.255
allowed-peer-ip=172.28.7.10-172.28.7.10

# Логи в stdout (docker logs), без чувствительных данных.
log-file=stdout
simple-log

# --- Лимиты (защита от абуза недоверенными клиентами) ------------------------
#
# 12 аллокаций на пользователя — с большим запасом: клиент делает ОДНУ аллокацию
# на звонок (turnPortPrunePolicy=KEEP_FIRST_READY на стороне приложения; до этой
# настройки их было по одной на каждую сеть устройства, то есть до четырёх).
user-quota=12
# Ниже размера диапазона портов выше (2000): квота должна упираться в себя, а не
# в исчерпание портов.
total-quota=1200
max-bps=0
# Время жизни аллокации/разрешения/канала. Задано явно, потому что от этих
# значений напрямую зависит, переживёт ли разговор паузу в цепи Tor: аллокация
# должна жить дольше, чем клиент успеет пересобрать ICE.
max-allocate-lifetime=3600
permission-lifetime=300
channel-lifetime=600
