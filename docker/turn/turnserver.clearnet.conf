# AEGIS coturn — профиль «onion + клирнет» (docker-compose.clearnet.yml).
#
# Подключается ВМЕСТО turnserver.conf тем же путём /etc/coturn/turnserver.conf
# (overlay монтирует этот файл поверх). Один экземпляр coturn обслуживает:
#   * клиентов в режиме «Tor ВКЛ» — через второй onion (tor → coturn:3478/tcp);
#   * клиентов в режиме «Tor ВЫКЛ» — напрямую: 3478/udp, 3478/tcp, TURNS 5349/tcp.
#
# ZERO-TRUST (§10.9): медиа сквозное (DTLS-SRTP + кадровый AES-GCM) — coturn
# ретранслирует только шифртекст. Клиенты в режиме без Tor приходят с реальных
# IP (они согласились на это в диалоге выключения Tor), поэтому журнал ниже
# выключен полностью: маскировать адреса coturn не умеет.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# --- Адрес ретрансляции — ВНУТРЕННИЙ, external-ip НЕ ЗАДАЁТСЯ ---------------
#
# Собеседники любого режима всегда работают с ОДНИМ И ТЕМ ЖЕ coturn. Поэтому
# единственная нужная пара кандидатов, когда прямого пути нет, — relay↔relay:
# аллокация одного абонента отправляет в аллокацию другого на этом же сервере.
# С адресом ретрансляции 172.28.7.10 это доставка внутри контейнера — неважно,
# пришёл абонент через onion (TCP) или из интернета (UDP/TCP/TLS).
#
# С `external-ip=<публичный>/172.28.7.10` все relay-кандидаты стали бы
# `<публичный>:порт`, и relay↔relay пошёл бы наружу и обратно (hairpin). Docker
# при этом подменяет адрес источника на шлюз сети, TURN-разрешения перестают
# совпадать — и молча ломались бы даже звонки «Tor ↔ Tor», которые работают
# сейчас. Цена отказа от external-ip: пары «relay ↔ srflx» невозможны, а с ними
# и необходимость публиковать диапазон relay-портов наружу.
relay-ip=172.28.7.10
min-port=49152
max-port=51152

# --- Аутентификация: эфемерные креды от релея (GET /v1/turn) ---------------
use-auth-secret
realm=aegis

# --- TLS для TURNS (5349) ----------------------------------------------------
# Сертификат Let's Encrypt выпускает Caddy; сервис turn-certs копирует его сюда с
# правами пользователя coturn и шлёт SIGUSR2 при каждом обновлении (coturn
# перечитывает сертификат без перезапуска). Пока сертификата нет, coturn
# работает без TLS-листенера (UDP/TCP 3478 и onion не затронуты).
cert=/turn-certs/cert.pem
pkey=/turn-certs/key.pem
no-tlsv1
no-tlsv1_1
# DTLS-TURN WebRTC не использует.
no-dtls

# Минимизация поверхности и метаданных.
no-cli
no-multicast-peers
no-software-attribute
stale-nonce=600
fingerprint
# Без RFC 5780: клиенты не прощупывают тип NAT, а сервер не служит усилителем.
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# --- КОМУ РАЗРЕШЕНО РЕТРАНСЛИРОВАТЬ — только самому себе ---------------------
#
# Открытый клирнет-порт не делает coturn открытым прокси: ретранслировать можно
# ТОЛЬКО в собственные аллокации (172.28.7.10). Ни интернет-адреса, ни частные и
# служебные диапазоны (SSRF во внутреннюю сеть хоста и облака — 169.254.169.254 и
# т. п.) недостижимы. «allowed» сильнее «denied», поэтому запрет всего плюс
# точечное разрешение — это белый список из одного адреса.
denied-peer-ip=0.0.0.0-255.255.255.255
allowed-peer-ip=172.28.7.10-172.28.7.10

# --- Журнал выключен ---------------------------------------------------------
# В клирнете coturn писал бы в журнал реальные IP клиентов («tcp or tls connected
# to: <IP>:<port>» и т. п.), а маскировки у него нет. Для разбора проблем журнал
# можно временно включить, заменив три строки ниже на `log-file=stdout` и
# `simple-log` (и помнить, что тогда в docker logs окажутся IP).
# simple-log обязателен: без него coturn дописывает к имени дату
# (/dev/null_ГГГГ-ММ-ДД.log) и пишет в stderr ошибку открытия файла.
log-file=/dev/null
simple-log
no-stdout-log

# --- Лимиты: защита от злоупотребления кредами ---------------------------------
#
# Креды выдаются всем, кто дотянется до релея, поэтому чужие аллокации возможны.
# Отправлять они могут только в другие аллокации этого же сервера, а лимиты ниже
# не дают превратить ретранслятор в бесплатный канал.
user-quota=12
total-quota=1200
# Потолок полосы одной сессии, байт/с (≈3,2 Мбит/с): с запасом для видео 720p.
max-bps=400000
max-allocate-lifetime=3600
permission-lifetime=300
channel-lifetime=600
