# AEGIS — ОПЦИОНАЛЬНАЯ публикация STUN для ПРЯМЫХ звонков (§7.5).
#
# УСТАРЕВШИЙ ПУТЬ: нужен только старым версиям клиента с переключателем «медиапоток
# через Tor». Для режима «Tor ВЫКЛ» новых клиентов используйте
# docker-compose.clearnet.yml — он публикует тот же 3478/udp (плюс TURN и TURNS),
# поэтому вместе эти два файла не подключаются.
#
# Применяется только вместе с основным файлом и только осознанно:
#   docker compose -f docker-compose.yml -f docker-compose.stun.yml up -d
#
# ─────────────────────────────────────────────────────────────────────────────
# ЗАЧЕМ ЭТО НУЖНО
#
# Чтобы два абонента соединились НАПРЯМУЮ, каждый должен узнать, каким его адрес
# виден снаружи собственного NAT. Единственный способ — спросить у сервера в
# интернете по UDP: «с какого адреса пришёл мой пакет?». Это и есть STUN Binding.
#
# Через Tor это принципиально не работает: сервер увидел бы адрес выходного узла
# Tor, а не абонента, и такой «публичный адрес» никуда не ведёт. Поэтому пока
# STUN не опубликован, прямого пути не существует ВООБЩЕ, и весь медиатрафик
# идёт через onion-ретранслятор: работает надёжно, но с задержкой Tor и с
# нагрузкой на ваш сервер.
#
# ─────────────────────────────────────────────────────────────────────────────
# ЧТО ЭТО ЗНАЧИТ ДЛЯ ПРИВАТНОСТИ — прямо, без смягчений
#
#  * Клиент, отправивший запрос STUN, РАСКРЫВАЕТ ЭТОМУ СЕРВЕРУ СВОЙ РЕАЛЬНЫЙ IP.
#  * Приложение обращается сюда ТОЛЬКО когда пользователь сам выключил
#    «медиапоток через Tor», то есть уже согласился на прямое соединение (и уже
#    раскрывает IP собеседнику — это свойство любого P2P-звонка, включая Signal
#    и WhatsApp). В анонимном режиме этот порт не используется вовсе.
#  * ШИФРОВАНИЕ НЕ ЗАТРАГИВАЕТСЯ НИКАК. STUN не участвует в передаче медиа: он
#    отвечает одним пакетом «твой адрес такой-то». Медиапоток остаётся под
#    DTLS-SRTP со сверкой отпечатков и кодом SAS, как и был.
#  * Сервер не узнаёт ни с кем идёт звонок, ни когда он начался: STUN Binding
#    анонимен и не связан с аккаунтом.
#
# ─────────────────────────────────────────────────────────────────────────────
# ЧТО СДЕЛАТЬ, ЧТОБЫ ЭТО ЗАРАБОТАЛО (все три шага обязательны)
#
#  1. Открыть UDP-порт в файрволе хоста:
#         sudo ufw allow 3478/udp comment 'AEGIS STUN'
#
#  2. Прописать в .env публичный адрес, который клиент получит через GET /v1/turn
#     (домен или IP — как к серверу реально приходят пакеты):
#         AEGIS_STUN_PUBLIC=203.0.113.10:3478
#     Пусто = клиент STUN не запрашивает, даже если порт открыт.
#
#  3. ПРОВЕРИТЬ, что контейнер видит настоящий адрес клиента, а не адрес
#     docker-шлюза. Если Docker поднимет для этого порта userland-proxy,
#     источник будет подменён на 172.28.7.1, и STUN станет отвечать всем
#     одинаковой чепухой — прямой путь не построится, а причину будет не видно
#     ни в одном логе. Проверка описана в README.md (раздел «Публичный STUN»).
#
# Откатить = перестать передавать этот файл в `docker compose` и очистить
# AEGIS_STUN_PUBLIC. Ни данные, ни onion-адреса это не затрагивает.

services:
  coturn:
    ports:
      # Только UDP и только 3478: TURN-ретрансляция наружу НЕ публикуется —
      # она остаётся доступной исключительно через onion (иначе ретранслятором
      # смог бы пользоваться кто угодно из интернета). Наружу открыт ровно один
      # ответ «твой адрес такой-то».
      - "${AEGIS_STUN_BIND:-0.0.0.0}:3478:3478/udp"

  relay:
    # Релей отдаёт клиенту адрес STUN в GET /v1/turn. Переменная берётся из .env
    # через env_file основного файла; здесь она указана явно, чтобы забытый
    # AEGIS_STUN_PUBLIC ломал запуск сразу и с понятным текстом, а не приводил к
    # молчаливо неработающим прямым звонкам.
    environment:
      AEGIS_STUN_PUBLIC: ${AEGIS_STUN_PUBLIC:?укажите AEGIS_STUN_PUBLIC=<host|ip>:3478 в .env}
